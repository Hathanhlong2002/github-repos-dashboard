name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'data/dashboard.json'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["Update Repos Dashboard"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$STATUS" = "200" ]; then
            BUILD_TYPE=$(python3 -c 'import json; print(json.load(open("/tmp/pages.json")).get("build_type", ""))' 2>/dev/null || echo "")
            if [ "$BUILD_TYPE" = "workflow" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::GitHub Pages is set to '${BUILD_TYPE:-branch}' instead of 'GitHub Actions'. Open Settings -> Pages -> Source: GitHub Actions, then re-run this workflow."
              echo "ready=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::GitHub Pages is not enabled yet (HTTP $STATUS). Open Settings -> Pages -> Source: GitHub Actions, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pages_check.outputs.ready == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Assemble static site
        if: steps.pages_check.outputs.ready == 'true'
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          if [ -f data/dashboard.json ]; then
            cp data/dashboard.json _site/data/dashboard.json
          fi
      - name: Setup Pages
        if: steps.pages_check.outputs.ready == 'true'
        uses: actions/configure-pages@v4
      - name: Upload artifact
        if: steps.pages_check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        if: steps.pages_check.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
